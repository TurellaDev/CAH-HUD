<!doctype html>
<!--
  cah-hud inventory page - a fork of hmp-inventory's bundled Arcanum renderer,
  redesigned: translucent panels (the world stays visible behind the screen),
  one flat list with no category tabs, and three actions per item:
  Equip/Unequip (native gear, mounts and potions), Use (usable items) and
  Drop (drops the stack on the ground as a physics prop others can pick up).

  It implements the same versioned "hmp.inventory.ui/v1" bridge as the original:
    callEvent("ready") after listeners are attached;
    listens for "configure", "model", "actionError";
    calls callEvent("close"|"refresh"|"use"|"equip"|"drop", JSON.stringify(...)).
  Point hmp-inventory's ui.url at fw://resources/cah-hud/dist/inventory.html to use it.
  Fonts and the fallback icon load from the hmp-inventory resource so nothing is duplicated.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    @font-face { font-family:"Cinzel"; src:url("fw://resources/hmp-inventory/dist/fonts/Cinzel-Variable.ttf") format("truetype"); font-style:normal; font-weight:400 900; font-display:swap; }
    @font-face { font-family:"Spectral"; src:url("fw://resources/hmp-inventory/dist/fonts/Spectral-Regular.ttf") format("truetype"); font-style:normal; font-weight:400; font-display:swap; }
    :root {
      color-scheme:dark;
      --gold:#d8b56b;
      --gold-deep:#c19a4e;
      --line:rgba(201,162,90,.25);
      --line-soft:rgba(201,162,90,.12);
      --paper:#e7d8b4;
      --text:#c2b291;
      --muted:#a89873;
    }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; font-family:"Spectral",Georgia,serif; background:transparent; color:var(--paper); }
    body { display:grid; place-items:center; background:rgba(4,3,1,.35); }
    .shell { width:min(1060px,90vw); height:min(680px,82vh); background:rgba(12,9,5,.55); border:1px solid var(--line); border-radius:6px; box-shadow:0 24px 70px rgba(0,0,0,.5); position:relative; overflow:hidden; display:flex; flex-direction:column; }
    header { display:flex; align-items:center; justify-content:space-between; padding:20px 28px 14px; border-bottom:1px solid var(--line-soft); background:rgba(10,7,3,.35); }
    .eyebrow { color:var(--muted); font-family:"Cinzel",Georgia,serif; font-size:10px; font-weight:600; line-height:1.2; letter-spacing:.22em; text-transform:uppercase; margin-bottom:6px; }
    .eyebrow:before { content:""; display:inline-block; width:7px; height:7px; margin-right:10px; background:var(--gold); transform:rotate(45deg); vertical-align:1px; }
    h1 { margin:0; font-family:"Cinzel",Georgia,serif; font-weight:600; font-size:24px; letter-spacing:.07em; color:var(--paper); }
    .stats { display:flex; gap:10px; align-items:center; font:11px ui-monospace,Consolas,monospace; color:var(--text); }
    .pill { border:1px solid var(--line-soft); border-radius:4px; padding:7px 10px; min-width:92px; text-align:center; background:rgba(0,0,0,.25); }
    .keyhint { border:1px dashed rgba(201,162,90,.35); border-radius:4px; padding:7px 10px; text-align:center; color:var(--muted); }
    button { color:var(--text); background:rgba(201,162,90,.05); border:1px solid var(--line-soft); border-radius:4px; font-family:"Cinzel",Georgia,serif; font-size:10px; letter-spacing:.09em; padding:9px 13px; cursor:pointer; }
    button:hover,button:focus-visible { color:var(--paper); border-color:rgba(201,162,90,.42); background:rgba(201,162,90,.12); outline:none; }
    .body { flex:1; display:grid; grid-template-columns:1fr 300px; min-height:0; }
    main { padding:18px 22px; overflow:auto; min-width:0; }
    .tools { display:flex; gap:10px; margin-bottom:14px; }
    input { flex:1; min-width:0; background:rgba(0,0,0,.3); border:1px solid var(--line-soft); border-radius:4px; color:var(--paper); padding:9px 12px; outline:none; font-family:"Spectral",Georgia,serif; }
    input:focus { border-color:rgba(201,162,90,.48); box-shadow:0 0 0 2px rgba(201,162,90,.08); }
    input::placeholder { color:#6f6553; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:10px; }
    .card { min-height:138px; background:rgba(14,11,7,.42); border:1px solid var(--line-soft); border-radius:4px; padding:11px; position:relative; cursor:pointer; }
    .card:hover,.card.selected { border-color:rgba(201,162,90,.5); background:rgba(201,162,90,.1); }
    .card.equipped:after { content:""; position:absolute; top:5px; right:5px; width:7px; height:7px; background:var(--gold); transform:rotate(45deg); box-shadow:0 0 6px rgba(216,181,107,.8); }
    .icon { width:50px; height:50px; object-fit:contain; display:block; margin:3px auto 9px; filter:drop-shadow(0 4px 8px rgba(0,0,0,.7)); }
    .name { font-family:"Cinzel",Georgia,serif; font-size:11px; letter-spacing:.025em; line-height:1.35; text-align:center; }
    .amount { position:absolute; right:8px; bottom:6px; color:var(--gold); font:600 11px ui-monospace,Consolas,monospace; }
    .source { position:absolute; top:7px; left:7px; font:8px ui-monospace,Consolas,monospace; letter-spacing:.1em; color:var(--muted); text-transform:uppercase; }
    aside { border-left:1px solid var(--line-soft); padding:22px; overflow:auto; background:rgba(8,6,3,.4); }
    aside .hero { width:82px; height:82px; display:block; margin:10px auto 18px; object-fit:contain; }
    aside h2 { margin:0 0 7px; font-family:"Cinzel",Georgia,serif; font-weight:600; font-size:20px; letter-spacing:.03em; }
    aside p { color:var(--muted); font:13px/1.55 "Spectral",Georgia,serif; }
    dl { margin:18px 0; font:10px/1.9 ui-monospace,Consolas,monospace; }
    dt { float:left; clear:left; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; }
    dd { text-align:right; color:var(--text); }
    .actions { display:flex; flex-direction:column; gap:8px; }
    .use { width:100%; color:#1a1306; background:linear-gradient(180deg,#dcb96e,var(--gold-deep)); border-color:var(--gold-deep); font-weight:700; }
    .use:hover,.use:focus-visible { color:#1a1306; background:#e2c27d; }
    .equip { width:100%; }
    .equip.on { color:var(--paper); border-color:rgba(201,162,90,.42); }
    .drop { width:100%; }
    .drop:hover { border-color:rgba(190,80,60,.55); color:#e8b3a3; }
    .empty { padding:60px 20px; text-align:center; color:var(--muted); font-style:italic; }
    footer { padding:10px 28px 14px; color:#6f6553; font:9px ui-monospace,Consolas,monospace; letter-spacing:.025em; background:rgba(10,7,3,.35); }
    @media(max-width:820px){ .body{grid-template-columns:1fr}.body aside{display:none}.shell{width:94vw} }
    @media(prefers-reduced-motion:reduce){ *{scroll-behavior:auto!important;transition:none!important} }
  </style>
</head>
<body>
  <section class="shell">
    <header>
      <div><div class="eyebrow">Possessions</div><h1 id="title">Inventory</h1></div>
      <div class="stats"><div class="pill" id="slots">0 / 0 slots</div><div class="pill" id="weight">0 / 0 weight</div><span class="keyhint" id="keyhint">I opens &middot; TAB closes</span><button id="refresh">Refresh</button><button id="close">Close</button></div>
    </header>
    <div class="body">
      <main><div class="tools"><input id="search" placeholder="Search items…" /></div><div class="grid" id="grid"></div></main>
      <aside id="detail"><div class="eyebrow">Item details</div><p>Select an item to inspect it.</p></aside>
    </div>
    <footer>Custom possessions and in-game items share this view; their authority remains separate.</footer>
  </section>
  <script>
    const send=(name,payload)=>{try{callEvent(name,JSON.stringify(payload||{}))}catch(_){}};
    let data={items:[],container:{}},selected=null,query="";
    const esc=(s)=>String(s??"").replace(/[&<>"']/g,c=>({"&":"\x26amp;","<":"\x26lt;",">":"\x26gt;",'"':"\x26quot;","'":"\x26#39;"}[c]));
    const icon=(url)=>/^(?:https?|fw):\/\//i.test(String(url||""))?String(url):"fw://resources/hmp-inventory/dist/icons/item.svg";
    // A potion is "equipped" while it sits on the potion wheel rather than in storage.
    const isPotion=(i)=>i.source==="native"&&(i.holder==="HealthPotionStorage"||i.holder==="SanctuaryWheel");
    const equippedOf=(i)=>i.source==="native"&&(i.kind==="mount"||i.kind==="gear"?i.equipped===true:isPotion(i)&&i.holder==="SanctuaryWheel");
    const equippableOf=(i)=>i.source==="native"&&(i.kind==="mount"||i.kind==="gear"||isPotion(i));
    const droppableOf=(i)=>!(i.source==="native"&&(i.itemId||"").toLowerCase()==="knuts"||i.name==="native:galleons");
    // TAB toggles the screen closed (the HUD shortcut opens it with I); Escape is a courtesy extra.
    window.addEventListener("keydown",(event)=>{
      const key=String(event.key||"").toLowerCase();
      if(key==="tab"||key==="escape"){event.preventDefault();event.stopPropagation();send("close",{});}
    },true);
    function visible(){return data.items.filter(i=>!query||(`${i.label} ${i.name} ${i.itemId||""}`).toLowerCase().includes(query));}
    function renderGrid(){const rows=visible();document.querySelector("#grid").innerHTML=rows.length?rows.map((i,n)=>`<article class="card ${selected===i?"selected":""} ${equippedOf(i)?"equipped":""}" data-item="${n}"><span class="source">${i.source==="native"?"in-game":"custom"}</span><img class="icon" src="${esc(icon(i.icon))}"/><div class="name">${esc(i.label)}</div><span class="amount">×${i.amount}</span></article>`).join(""):`<div class="empty">No items match this view.</div>`;document.querySelectorAll("[data-item]").forEach(b=>b.onclick=()=>{selected=rows[Number(b.dataset.item)];renderGrid();renderDetail()});}
    function renderDetail(){
      const a=document.querySelector("#detail");
      if(!selected){a.innerHTML=`<div class="eyebrow">Item details</div><p>Select an item to inspect it.</p>`;return}
      const meta=selected.metadata&&Object.keys(selected.metadata).length?`<p>${esc(JSON.stringify(selected.metadata))}</p>`:"";
      const equipped=equippedOf(selected),equippable=equippableOf(selected),usable=selected.usable===true,droppable=droppableOf(selected);
      a.innerHTML=`<div class="eyebrow">${selected.source==="native"?"In-game item":"Custom item"}</div><img class="hero" src="${esc(icon(selected.icon))}"/><h2>${esc(selected.label)}</h2><p>${esc(selected.description||"No description.")}</p><dl><dt>Amount</dt><dd>${selected.amount}</dd><dt>Category</dt><dd>${esc(selected.category)}</dd>${selected.holder?`<dt>Game holder</dt><dd>${esc(selected.holder)}</dd>`:""}${selected.source==="native"&&(selected.kind==="mount"||selected.kind==="gear"||isPotion(selected))?`<dt>Equipped</dt><dd>${equipped?"yes":"no"}</dd>`:""}${selected.weight?`<dt>Weight</dt><dd>${selected.weight.toFixed(2)}</dd>`:""}</dl>${meta}<div class="actions">${equippable?`<button class="equip ${equipped?"on":""}" id="equip">${equipped?"Unequip":"Equip"}</button>`:""}${usable?`<button class="use" id="use">Use item</button>`:""}${droppable?`<button class="drop" id="drop">Drop</button>`:""}</div>`;
      const equipB=document.querySelector("#equip");if(equipB)equipB.onclick=()=>send("equip",{source:"native",itemId:selected.itemId,variation:selected.variation||"",equipped:!equipped});
      const useB=document.querySelector("#use");if(useB)useB.onclick=()=>send("use",selected.source==="native"?{source:"native",itemId:selected.itemId,variation:selected.variation||""}:{source:"custom",slot:selected.slot});
      const dropB=document.querySelector("#drop");if(dropB)dropB.onclick=()=>send("drop",selected.source==="native"?{source:"native",itemId:selected.itemId,variation:selected.variation||""}:{source:"custom",slot:selected.slot});
    }
    function render(){document.querySelector("#title").textContent=data.title||"Inventory";document.querySelector("#slots").textContent=`${data.usedSlots||0} / ${data.container?.slots||0} slots`;document.querySelector("#weight").textContent=`${Number(data.weight||0).toFixed(1)} / ${Number(data.container?.maxWeight||0).toFixed(1)} weight`;renderGrid();renderDetail()}
    document.querySelector("#search").oninput=e=>{query=e.target.value.trim().toLowerCase();renderGrid();renderDetail()};
    document.querySelector("#close").onclick=()=>send("close",{});document.querySelector("#refresh").onclick=()=>send("refresh",{});
    window.addEventListener("model",event=>{data=event.detail||{items:[],container:{}};selected=null;render()});
    window.addEventListener("configure",event=>{const c=event&&event.detail||{};if(c.contract&&c.contract!=="hmp.inventory.ui/v1")console.warn("[cah-hud] unsupported inventory contract",c.contract)});
    send("ready");
    render();
  </script>
</body>
</html>
