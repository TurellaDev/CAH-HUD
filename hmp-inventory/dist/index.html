<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    @font-face { font-family:"Cinzel"; src:url("./fonts/Cinzel-Variable.ttf") format("truetype"); font-style:normal; font-weight:400 900; font-display:swap; }
    @font-face { font-family:"Spectral"; src:url("./fonts/Spectral-Regular.ttf") format("truetype"); font-style:normal; font-weight:400; font-display:swap; }
    :root {
      color-scheme:dark;
      --arcanum-gold:#d8b56b;
      --arcanum-gold-deep:#c19a4e;
      --arcanum-line:rgba(201,162,90,.18);
      --arcanum-line-soft:rgba(201,162,90,.09);
      --arcanum-bg:#0a0805;
      --arcanum-panel:#15120c;
      --arcanum-panel-deep:#100d08;
      --arcanum-field:#0e0b07;
      --arcanum-paper:#e7d8b4;
      --arcanum-text:#c2b291;
      --arcanum-muted:#8a7b5f;
    }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; font-family:"Spectral",Georgia,serif; background:transparent; color:var(--arcanum-paper); }
    body { display:grid; place-items:center; }
    .shell { width:min(1080px,88vw); height:min(720px,84vh); background:var(--arcanum-panel); border:1px solid rgba(201,162,90,.14); border-radius:5px; box-shadow:0 30px 80px rgba(0,0,0,.62),inset 0 0 80px rgba(201,162,90,.025); position:relative; overflow:hidden; }
    .shell:before { content:""; position:absolute; inset:8px; border:1px solid rgba(201,162,90,.07); border-radius:2px; pointer-events:none; z-index:2; }
    header { height:102px; display:flex; align-items:center; justify-content:space-between; padding:26px 34px 20px; border-bottom:1px solid var(--arcanum-line); position:relative; background:linear-gradient(90deg,var(--arcanum-panel-deep),var(--arcanum-panel)); }
    .eyebrow { color:var(--arcanum-muted); font-family:"Cinzel",Georgia,serif; font-size:10px; font-weight:600; line-height:1.2; letter-spacing:.22em; text-transform:uppercase; margin-bottom:7px; }
    .eyebrow:before { content:""; display:inline-block; width:7px; height:7px; margin-right:10px; background:var(--arcanum-gold); transform:rotate(45deg); vertical-align:1px; }
    h1 { margin:0; font-family:"Cinzel",Georgia,serif; font-weight:600; font-size:27px; letter-spacing:.07em; color:var(--arcanum-paper); }
    .stats { display:flex; gap:10px; align-items:center; font:11px ui-monospace,Consolas,monospace; color:var(--arcanum-text); }
    .pill { border:1px solid var(--arcanum-line); border-radius:4px; padding:8px 11px; min-width:98px; text-align:center; background:var(--arcanum-field); }
    button { color:var(--arcanum-text); background:rgba(201,162,90,.04); border:1px solid var(--arcanum-line); border-radius:4px; font-family:"Cinzel",Georgia,serif; font-size:10px; letter-spacing:.09em; padding:9px 13px; cursor:pointer; }
    button:hover,button:focus-visible { color:var(--arcanum-paper); border-color:rgba(201,162,90,.42); background:rgba(201,162,90,.11); outline:none; }
    .body { height:calc(100% - 102px); display:grid; grid-template-columns:220px 1fr 272px; }
    nav { border-right:1px solid var(--arcanum-line); padding:24px 18px; overflow:auto; background:var(--arcanum-panel-deep); }
    .tab { display:flex; width:100%; justify-content:space-between; margin-bottom:8px; text-align:left; border-color:transparent; }
    .tab:before { content:""; width:6px; height:6px; margin:3px 10px 0 1px; border:1px solid #6b6049; transform:rotate(45deg); flex:none; }
    .tab span:first-of-type { flex:1; }
    .tab.active { border-color:rgba(201,162,90,.22); color:#ecdcb7; background:rgba(201,162,90,.10); }
    .tab.active:before { background:var(--arcanum-gold); border-color:var(--arcanum-gold); }
    .count { opacity:.65; }
    main { padding:22px; overflow:auto; }
    .tools { display:flex; gap:10px; margin-bottom:16px; }
    input { flex:1; min-width:0; background:var(--arcanum-field); border:1px solid var(--arcanum-line); border-radius:4px; color:var(--arcanum-paper); padding:10px 12px; outline:none; font-family:"Spectral",Georgia,serif; }
    input:focus { border-color:rgba(201,162,90,.48); box-shadow:0 0 0 2px rgba(201,162,90,.08); }
    input::placeholder { color:#6f6553; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(116px,1fr)); gap:11px; }
    .card { min-height:142px; background:rgba(14,11,7,.72); border:1px solid var(--arcanum-line-soft); border-radius:4px; padding:12px; position:relative; cursor:pointer; box-shadow:inset 0 0 22px rgba(0,0,0,.18); }
    .card:after { content:""; position:absolute; inset:4px; border:1px solid rgba(201,162,90,.035); pointer-events:none; }
    .card:hover,.card.selected { border-color:rgba(201,162,90,.5); background:linear-gradient(145deg,rgba(201,162,90,.11),rgba(14,11,7,.82)); }
    .icon { width:52px; height:52px; object-fit:contain; display:block; margin:4px auto 10px; filter:drop-shadow(0 5px 9px #000); }
    .name { font-family:"Cinzel",Georgia,serif; font-size:11px; letter-spacing:.025em; line-height:1.35; text-align:center; }
    .amount { position:absolute; right:8px; bottom:7px; color:var(--arcanum-gold); font:600 11px ui-monospace,Consolas,monospace; }
    .source { position:absolute; top:7px; left:7px; font:8px ui-monospace,Consolas,monospace; letter-spacing:.1em; color:var(--arcanum-muted); text-transform:uppercase; }
    aside { border-left:1px solid var(--arcanum-line); padding:25px; overflow:auto; background:var(--arcanum-panel-deep); }
    aside .hero { width:86px; height:86px; display:block; margin:12px auto 22px; object-fit:contain; }
    aside h2 { margin:0 0 7px; font-family:"Cinzel",Georgia,serif; font-weight:600; font-size:21px; letter-spacing:.03em; }
    aside p { color:var(--arcanum-muted); font:13px/1.55 "Spectral",Georgia,serif; }
    dl { margin:22px 0; font:10px/1.9 ui-monospace,Consolas,monospace; }
    dt { float:left; clear:left; color:var(--arcanum-muted); text-transform:uppercase; letter-spacing:.1em; }
    dd { text-align:right; color:var(--arcanum-text); }
    .use { width:100%; color:#1a1306; background:linear-gradient(180deg,#dcb96e,var(--arcanum-gold-deep)); border-color:var(--arcanum-gold-deep); font-weight:700; }
    .use:hover,.use:focus-visible { color:#1a1306; background:#e2c27d; }
    .empty { grid-column:1/-1; padding:60px 20px; text-align:center; color:var(--arcanum-muted); font-style:italic; }
    footer { position:absolute; left:24px; bottom:17px; color:#6f6553; font:9px ui-monospace,Consolas,monospace; letter-spacing:.025em; }
    @media(max-width:820px){ .body{grid-template-columns:160px 1fr}.body aside{display:none}.shell{width:94vw}.stats .pill:nth-child(2){display:none} }
    @media(prefers-reduced-motion:reduce){ *{scroll-behavior:auto!important;transition:none!important} }
  </style>
</head>
<body>
  <section class="shell">
    <header>
      <div><div class="eyebrow">Possessions</div><h1 id="title">Inventory</h1></div>
      <div class="stats"><div class="pill" id="slots">0 / 0 slots</div><div class="pill" id="weight">0 / 0 weight</div><button id="refresh">Refresh</button><button id="close">Close</button></div>
    </header>
    <div class="body">
      <nav id="tabs"></nav>
      <main><div class="tools"><input id="search" placeholder="Search items…" /></div><div class="grid" id="grid"></div></main>
      <aside id="detail"><div class="eyebrow">Item details</div><p>Select an item to inspect it.</p></aside>
    </div>
    <footer>Custom possessions and in-game items share this view; their authority remains separate.</footer>
  </section>
  <script>
    const send=(name,payload)=>{try{callEvent(name,JSON.stringify(payload||{}))}catch(_){}};
    let data={items:[],container:{}},category="All",selected=null,query="";
    const esc=(s)=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const icon=(url)=>/^(?:https?|fw):\/\//i.test(String(url||""))?String(url):"fw://resources/hmp-inventory/dist/icons/item.svg";
    function categories(){const map=new Map([["All",data.items.length],["Custom",data.custom?.length||0],["In-game",data.native?.length||0]]);for(const i of data.items)map.set(i.category,(map.get(i.category)||0)+1);return [...map];}
    function visible(){return data.items.filter(i=>(category==="All"||category==="Custom"&&i.source==="custom"||category==="In-game"&&i.source==="native"||i.category===category)&&(!query||(`${i.label} ${i.name} ${i.itemId||""}`).toLowerCase().includes(query)));}
    function renderTabs(){document.querySelector("#tabs").innerHTML=categories().map(([name,count])=>`<button class="tab ${name===category?"active":""}" data-tab="${esc(name)}"><span>${esc(name)}</span><span class="count">${count}</span></button>`).join("");document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{category=b.dataset.tab;selected=null;render()});}
    function renderGrid(){const rows=visible();document.querySelector("#grid").innerHTML=rows.length?rows.map((i,n)=>`<article class="card ${selected===i?"selected":""}" data-item="${n}"><span class="source">${i.source==="native"?"in-game":"custom"}</span><img class="icon" src="${esc(icon(i.icon))}"/><div class="name">${esc(i.label)}</div><span class="amount">×${i.amount}</span></article>`).join(""):`<div class="empty">No items match this view.</div>`;document.querySelectorAll("[data-item]").forEach(b=>b.onclick=()=>{selected=rows[Number(b.dataset.item)];renderGrid();renderDetail()});}
    function renderDetail(){const a=document.querySelector("#detail");if(!selected){a.innerHTML=`<div class="eyebrow">Item details</div><p>Select an item to inspect it.</p>`;return}const meta=selected.metadata&&Object.keys(selected.metadata).length?`<p>${esc(JSON.stringify(selected.metadata))}</p>`:"";a.innerHTML=`<div class="eyebrow">${selected.source==="native"?"In-game item":"Custom item"}</div><img class="hero" src="${esc(icon(selected.icon))}"/><h2>${esc(selected.label)}</h2><p>${esc(selected.description||"No description.")}</p><dl><dt>Amount</dt><dd>${selected.amount}</dd><dt>Category</dt><dd>${esc(selected.category)}</dd>${selected.slot?`<dt>Slot</dt><dd>${selected.slot}</dd>`:""}${selected.holder?`<dt>Game holder</dt><dd>${esc(selected.holder)}</dd>`:""}${selected.weight?`<dt>Weight</dt><dd>${selected.weight.toFixed(2)}</dd>`:""}</dl>${meta}${selected.usable?`<button class="use" id="use">Use item</button>`:""}`;const use=document.querySelector("#use");if(use)use.onclick=()=>send("use",selected.source==="native"?{source:"native",itemId:selected.itemId,variation:selected.variation||""}:{source:"custom",slot:selected.slot})}
    function render(){document.querySelector("#title").textContent=data.title||"Inventory";document.querySelector("#slots").textContent=`${data.usedSlots||0} / ${data.container?.slots||0} slots`;document.querySelector("#weight").textContent=`${Number(data.weight||0).toFixed(1)} / ${Number(data.container?.maxWeight||0).toFixed(1)} weight`;renderTabs();renderGrid();renderDetail()}
    document.querySelector("#search").oninput=e=>{query=e.target.value.trim().toLowerCase();selected=null;renderGrid();renderDetail()};
    document.querySelector("#close").onclick=()=>send("close",{});document.querySelector("#refresh").onclick=()=>send("refresh",{});
    window.addEventListener("model",event=>{data=event.detail||{items:[],container:{}};selected=null;render()});
    send("ready");
    render();
  </script>
</body>
</html>
